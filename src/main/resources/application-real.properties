# ─────────────────────────────────────────────
# WatchTower — REAL NETWORK MODE configuration
# Activated with: spring.profiles.active=real
# ─────────────────────────────────────────────

# Faster scheduling for real-time monitoring
spring.task.scheduling.pool.size=5

# More verbose logging in real mode to help troubleshoot
logging.level.com.watchtower.backend.service.NetworkDiscoveryService=INFO
logging.level.com.watchtower.backend.service.RealDataService=INFO
logging.level.com.watchtower.backend.service.NetworkMonitorService=INFO

# Network scan interval (ms) — how often to re-discover devices
watchtower.discovery.interval=60000
# Ping timeout (ms)
watchtower.ping.timeout=2000

# DPI packet classification (TLS SNI only, no decryption)
# watchtower.dpi.enabled=true
# watchtower.dpi.interface-hint=Wi-Fi
# watchtower.dpi.capture-filter=tcp dst port 443

# Active DPI config
watchtower.dpi.enabled=true
watchtower.dpi.interface-hint=
watchtower.dpi.capture-filter=tcp dst port 443
watchtower.dpi.min.confidence=40