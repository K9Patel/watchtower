spring.application.name=watchtower-backend

# ── Server ─────────────────────────────
server.port=8080
spring.profiles.active=real

# ── Database (PostgreSQL) ──────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/watchtower_db
spring.datasource.username=postgres
spring.datasource.password=kavya@123
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway ─────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# ── Email (Gmail SMTP) ─────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=knpatel9965@gmail.com
spring.mail.password=nqexwcukyauruxvt   
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Scheduling ─────────────────────────
spring.task.scheduling.pool.size=3

# ── App Config ─────────────────────────
watchtower.alert.threshold=80
watchtower.admin.email=knpatel9965@gmail.com
watchtower.pcap.windows-dll-dir=${NPCAP_DIR:}

# ── AI Recommendations (optional) ─────
watchtower.ai.enabled=${AI_ENABLED:true}
watchtower.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1/chat/completions}
watchtower.ai.model=${AI_MODEL:gpt-4o-mini}
watchtower.ai.api-key=${AI_API_KEY:}
watchtower.ai.timeout-ms=${AI_TIMEOUT_MS:12000}
watchtower.ai.max-tokens=${AI_MAX_TOKENS:260}
watchtower.ai.temperature=${AI_TEMPERATURE:0.2}

# ── Logging ────────────────────────────
logging.level.com.watchtower=DEBUG

spring.jpa.open-in-view=false
spring.thymeleaf.check-template-location=false
spring.jpa.show-sql=false

